permissions:
  packages: write
  contents: read

name: Build and publish Docker images to ghcr.io
on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io

jobs:
  docker_publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU / default LLVM image also gets :latest and the bare dated tag.
          - name: llvm
            file: llvm.dockerfile
            is_default: true
          - name: rocm
            file: rocm.dockerfile
            is_default: false
          - name: nvcc
            file: nvcc.dockerfile
            is_default: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Set image version
        id: version
        run: echo "value=$(date -u +%Y).$(date -u +%m).$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Compose image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.value }}
          VARIANT: ${{ matrix.name }}
          IS_DEFAULT: ${{ matrix.is_default }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${REPO}"
          {
            echo "${base}:${VARIANT}"
            echo "${base}:${VERSION}-${VARIANT}"
            if [[ "${IS_DEFAULT}" == "true" ]]; then
              echo "${base}:latest"
              echo "${base}:${VERSION}"
            fi
          } | tee tags.txt
          # Multiline output for build-push-action
          {
            echo "list<<EOF"
            cat tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
