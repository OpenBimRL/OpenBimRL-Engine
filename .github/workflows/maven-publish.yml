# Build, test, and publish OpenBimRL-Engine to GitHub Packages (Maven).
# Artifact: de.rub.bi.inf.openbimrl.engine:core:YYYY.MM.DD
# (classpath includes JNA libOpenBimRL-Engine-Native-x86_64.so)
#
# Path: bazel test → bazel run //:openbimrl_engine_maven.publish

name: Maven Package

on:
  push:
    branches:
      - main
      - master

env:
  OPENBIMRL_USE_PREBUILT_IFCOPENSHELL: "ON"
  OPENBIMRL_IFCOPENSHELL_PREFIX: /opt/ifcopenshell
  IFCOPENSHELL_GIT_TAG: eafa158ca0cd5ba2ca22b5e588b0375cab2efbce

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "true"

    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          libomp-dev \
          libomp5 \
          libboost-all-dev \
          xfonts-scalable \
          libocct-data-exchange-dev \
          libocct-draw-dev \
          libocct-foundation-dev \
          libocct-modeling-algorithms-dev \
          libocct-modeling-data-dev \
          libocct-ocaf-dev \
          libocct-visualization-dev \
          libmpfr-dev \
          libhdf5-dev \
          libgmp-dev \
          libxml2-dev \
          libeigen3-dev \
          cmake \
          ninja-build \
          make
        clang++ --version

    - name: Set up JDK 21
      uses: actions/setup-java@v5.7.0
      with:
        java-version: "21"
        distribution: jetbrains

    - name: Install Bazelisk
      uses: bazel-contrib/setup-bazel@0.19.0

    # Staging install under RUNNER_TEMP (ephemeral job disk), then copy to
    # OPENBIMRL_IFCOPENSHELL_PREFIX (/opt/ifcopenshell). Not Actions cache.
    - name: Build IfcOpenShell
      run: |
        set -euo pipefail
        IFCOS_PREFIX="${RUNNER_TEMP}/ifcopenshell"
        SRC="${RUNNER_TEMP}/IfcOpenShell"
        BUILD="${RUNNER_TEMP}/ifcos-build"
        rm -rf "${IFCOS_PREFIX}"
        mkdir -p "${IFCOS_PREFIX}"
        git clone --quiet https://github.com/IfcOpenShell/IfcOpenShell.git "${SRC}"
        git -C "${SRC}" checkout --quiet "${IFCOPENSHELL_GIT_TAG}"
        cmake -G Ninja -S "${SRC}/cmake" -B "${BUILD}" \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DCMAKE_INSTALL_PREFIX="${IFCOS_PREFIX}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DOCC_INCLUDE_DIR=/usr/include/opencascade \
          -DOCC_LIBRARY_DIR=/usr/lib/x86_64-linux-gnu \
          -DBUILD_SHARED_LIBS=ON \
          -DSCHEMA_VERSIONS="2x3;4;4x3_add2" \
          -DBUILD_CONVERT=OFF \
          -DBUILD_IFCPYTHON=OFF \
          -DBUILD_GEOMSERVER=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_DOCUMENTATION=OFF \
          -DWITH_CGAL=OFF \
          -DCOLLADA_SUPPORT=OFF \
          -DHDF5_SUPPORT=OFF \
          -DGLTF_SUPPORT=OFF \
          -DIFCXML_SUPPORT=OFF \
          -DUSD_SUPPORT=OFF
        cmake --build "${BUILD}" -j"$(nproc)"
        cmake --install "${BUILD}"

    - name: Install IfcOpenShell to /opt/ifcopenshell
      run: |
        set -euo pipefail
        IFCOS_PREFIX="${RUNNER_TEMP}/ifcopenshell"
        if [[ ! -d "${IFCOS_PREFIX}/lib" ]]; then
          echo "ERROR: IfcOpenShell prefix missing at ${IFCOS_PREFIX}" >&2
          exit 1
        fi
        sudo mkdir -p /opt
        sudo rm -rf /opt/ifcopenshell
        sudo cp -a "${IFCOS_PREFIX}" /opt/ifcopenshell

    - name: Bazel test
      run: |
        bazel test //:engine_unit_tests //:engine_tests

    - name: Set publish version
      id: version
      run: echo "value=$(date -u +%Y).$(date -u +%m).$(date -u +%d)" >> "$GITHUB_OUTPUT"

    - name: Publish to GitHub Packages
      env:
        MAVEN_REPO: https://maven.pkg.github.com/OpenBimRL/OpenBimRL-Engine
        MAVEN_USER: ${{ github.actor }}
        MAVEN_PASSWORD: ${{ github.token }}
      run: |
        bazel run //:openbimrl_engine_maven.publish \
          --define OPENBIMRL_ENGINE_VERSION=${{ steps.version.outputs.value }}
